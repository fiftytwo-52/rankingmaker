<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ranking Video Maker</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 800px;
      margin: 20px auto;
      padding: 0 15px;
      line-height: 1.5;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      font-weight: bold;
      margin-bottom: 5px;
    }
    input[type="text"], input[type="number"], select {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
    }
    button {
      padding: 8px 16px;
      cursor: pointer;
    }
    .btn-primary {
      background-color: #007bff;
      color: white;
      border: none;
      font-size: 16px;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <h1>Ranking Video Maker</h1>

  <form id="video-form" onsubmit="return false;">
    <div class="form-group">
      <label for="video-title">Main Video Title</label>
      <input type="text" id="video-title" name="title" value="TOP 5 RANKING" placeholder="e.g. TOP 5 GOALS OF THE YEAR" required>
    </div>

    <div class="form-group">
      <label for="resolution-preset">Resolution Preset</label>
      <select id="resolution-preset">
        <option value="1920x1080" selected>Landscape (1920x1080)</option>
        <option value="1080x1920">Vertical / Shorts (1080x1920)</option>
      </select>
    </div>

    <div class="form-group">
      <label for="accent-color">Accent Color (name or hex)</label>
      <input type="text" id="accent-color" name="accent" value="yellow" placeholder="yellow, cyan, #ffcc00">
    </div>

    <div class="form-group">
      <label for="bg-color">Background Color (hex or color name)</label>
      <input type="text" id="bg-color" name="bg_color" value="0x141414" placeholder="0x141414 or black">
    </div>

    <fieldset class="form-group" style="border: 1px solid #ccc; padding: 15px; border-radius: 4px;">
      <legend><strong>Media Assets & Audio (Optional)</strong></legend>
      <div style="margin-bottom: 12px;">
        <label>Background Image:</label>
        <div style="display: flex; gap: 10px; align-items: center;">
          <input type="file" id="bg-image-file" accept="image/*" style="display: none;">
          <button type="button" id="btn-upload-bg-image">Choose Background Image</button>
          <span id="bg-image-filename" style="color: #666; font-size: 14px;">No image selected</span>
          <input type="hidden" id="bg-image-id">
        </div>
      </div>
      <div>
        <label>Background Music:</label>
        <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
          <input type="file" id="bgm-file" accept="audio/*" style="display: none;">
          <button type="button" id="btn-upload-bgm">Choose Audio Track</button>
          <span id="bgm-filename" style="color: #666; font-size: 14px;">No music selected</span>
          <input type="hidden" id="bgm-id">
          <label style="margin-left: 15px;">BGM Volume:
            <input type="number" id="bgm-volume" value="0.25" min="0" max="2" step="0.05" style="width: 70px;">
          </label>
          <label style="margin-left: 15px;">Clip Volume:
            <input type="number" id="clip-volume" value="1.0" min="0" max="2" step="0.1" style="width: 70px;">
          </label>
        </div>
      </div>
    </fieldset>

    <fieldset class="form-group" style="border: 1px solid #ccc; padding: 15px; border-radius: 4px;">
      <legend><strong>Ranked Items</strong></legend>
      <div id="items-container"></div>
      <button type="button" id="btn-add-item" style="margin-top: 10px;">+ Add Item</button>
    </fieldset>

    <div class="form-group">
      <button type="button" id="btn-generate" class="btn-primary">Generate Video</button>
    </div>
  </form>

  <div id="job-status-section" style="display: none; margin-top: 20px; padding: 15px; border: 1px solid #007bff; border-radius: 4px; background: #f8f9fa;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
      <strong>Status: <span id="job-status-badge" style="text-transform: uppercase;">QUEUED</span></strong>
      <button type="button" id="btn-cancel-job" style="color: red; border: 1px solid red; background: white; border-radius: 3px; padding: 4px 10px;">Cancel</button>
    </div>
    <progress id="job-progress-bar" value="0" max="100" style="width: 100%; height: 22px;"></progress>
    <div id="job-progress-text" style="font-size: 14px; margin-top: 5px; color: #333;">Initializing...</div>

    <div id="job-error-msg" style="display: none; color: #dc3545; margin-top: 10px; font-weight: bold; white-space: pre-wrap; background: #ffe6e6; padding: 10px; border-radius: 4px;"></div>

    <div id="job-result-section" style="display: none; margin-top: 15px; border-top: 1px solid #ddd; padding-top: 15px;">
      <h3>Finished Video</h3>
      <video id="video-preview" controls style="max-width: 100%; max-height: 400px; display: block; margin-bottom: 12px; background: #000; border-radius: 4px;"></video>
      <div style="display: flex; gap: 10px; align-items: center;">
        <a id="download-link" href="#" download class="btn-primary" style="display: inline-block; text-decoration: none; padding: 8px 16px;">Download MP4</a>
        <button type="button" id="btn-delete-job" style="padding: 8px 16px; background: #dc3545; color: white; border: none; border-radius: 4px; cursor: pointer;">Delete Job</button>
      </div>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
